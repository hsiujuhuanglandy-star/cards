<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>廖文平・廣順禮儀社</title>
<style>
  :root {
    --bg: #f3f0ec;
    --surface: #ffffff;
    --surface-2: #e6e0d6;
    --text: #2a2622;
    --muted: #6b6258;
    --accent: #b08d4f;
    --accent-strong: #8f6f38;
    --rule: #ddd4c4;
    --hero-bg: #2a2622;
    --shadow: rgba(42, 38, 34, 0.16);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17140f;
      --surface: #201c17;
      --surface-2: #29241d;
      --text: #f2ede4;
      --muted: #b3a794;
      --accent: #d3ac6a;
      --accent-strong: #e3c084;
      --rule: #362f25;
      --hero-bg: #17140f;
      --shadow: rgba(0, 0, 0, 0.4);
    }
  }

  :root[data-theme="dark"] {
    --bg: #17140f;
    --surface: #201c17;
    --surface-2: #29241d;
    --text: #f2ede4;
    --muted: #b3a794;
    --accent: #d3ac6a;
    --accent-strong: #e3c084;
    --rule: #362f25;
    --hero-bg: #17140f;
    --shadow: rgba(0, 0, 0, 0.4);
  }

  :root[data-theme="light"] {
    --bg: #f3f0ec;
    --surface: #ffffff;
    --surface-2: #e6e0d6;
    --text: #2a2622;
    --muted: #6b6258;
    --accent: #b08d4f;
    --accent-strong: #8f6f38;
    --rule: #ddd4c4;
    --hero-bg: #2a2622;
    --shadow: rgba(42, 38, 34, 0.16);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    width: 100%;
    max-width: 440px;
    padding: 0 0 48px;
  }

  .hero {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 5;
    overflow: hidden;
    background:
      radial-gradient(60% 50% at 50% 28%, rgba(211, 172, 106, 0.25), transparent 70%),
      var(--hero-bg);
  }

  .hero img {
    position: absolute;
    left: 50%;
    bottom: 0;
    transform: translateX(-50%);
    width: 86%;
    height: 94%;
    object-fit: contain;
    object-position: bottom center;
  }

  .hero::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent 62%, var(--bg) 98%);
  }

  .identity {
    position: relative;
    margin-top: -56px;
    padding: 0 32px;
    text-align: center;
  }

  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--accent-strong);
    margin: 0 0 10px;
  }

  h1 {
    font-family: "Noto Serif TC", "Songti TC", "PMingLiU", Georgia, serif;
    font-weight: 600;
    font-size: 34px;
    letter-spacing: 0.12em;
    margin: 0;
    color: var(--text);
  }

  .title-line {
    margin: 8px 0 0;
    font-size: 15px;
    color: var(--muted);
    letter-spacing: 0.04em;
  }

  .divider {
    width: 40px;
    height: 1px;
    background: var(--accent);
    margin: 20px auto;
    opacity: 0.6;
  }

  .company {
    font-family: "Noto Serif TC", "Songti TC", Georgia, serif;
    font-size: 17px;
    letter-spacing: 0.06em;
    color: var(--text);
    margin: 0;
  }

  section {
    padding: 28px 32px 0;
  }

  .bio {
    margin: 0;
    font-size: 15px;
    line-height: 1.85;
    text-align: center;
    color: var(--text);
  }

  footer {
    margin-top: 36px;
    padding: 0 32px;
    text-align: center;
  }

  footer .line {
    width: 24px;
    height: 1px;
    background: var(--rule);
    margin: 0 auto 14px;
  }

  footer p {
    margin: 0;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--muted);
  }
</style>
</head>
