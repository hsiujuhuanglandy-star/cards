<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>陳哲銘・瓏偉不銹鋼</title>
<style>
  :root {
    --bg: #eef1f3;
    --surface: #ffffff;
    --surface-2: #dde3e7;
    --text: #16202a;
    --muted: #5a6b78;
    --accent: #2f7dd1;
    --accent-strong: #1c5fa8;
    --rule: #d4dde3;
    --hero-bg: #1c242c;
    --shadow: rgba(22, 32, 42, 0.16);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1318;
      --surface: #161f27;
      --surface-2: #1d2932;
      --text: #eef2f5;
      --muted: #93a6b3;
      --accent: #5b9de8;
      --accent-strong: #85b8f0;
      --rule: #223140;
      --hero-bg: #0d1318;
      --shadow: rgba(0, 0, 0, 0.4);
    }
  }

  :root[data-theme="dark"] {
    --bg: #0d1318;
    --surface: #161f27;
    --surface-2: #1d2932;
    --text: #eef2f5;
    --muted: #93a6b3;
    --accent: #5b9de8;
    --accent-strong: #85b8f0;
    --rule: #223140;
    --hero-bg: #0d1318;
    --shadow: rgba(0, 0, 0, 0.4);
  }

  :root[data-theme="light"] {
    --bg: #eef1f3;
    --surface: #ffffff;
    --surface-2: #dde3e7;
    --text: #16202a;
    --muted: #5a6b78;
    --accent: #2f7dd1;
    --accent-strong: #1c5fa8;
    --rule: #d4dde3;
    --hero-bg: #1c242c;
    --shadow: rgba(22, 32, 42, 0.16);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    width: 100%;
    max-width: 440px;
    padding: 0 0 48px;
  }

  .hero {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 5;
    overflow: hidden;
    background: var(--hero-bg);
  }

  .hero img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
  }

  .hero::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent 50%, var(--bg) 97%);
  }

  .identity {
    position: relative;
    margin-top: -56px;
    padding: 0 32px;
    text-align: center;
  }

  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--accent-strong);
    margin: 0 0 10px;
  }

  h1 {
    font-family: "Noto Serif TC", "Songti TC", "PMingLiU", Georgia, serif;
    font-weight: 600;
    font-size: 34px;
    letter-spacing: 0.12em;
    margin: 0;
    color: var(--text);
  }

  .title-line {
    margin: 8px 0 0;
    font-size: 15px;
    color: var(--muted);
    letter-spacing: 0.04em;
  }

  .divider {
    width: 40px;
    height: 1px;
    background: var(--accent);
    margin: 20px auto;
    opacity: 0.6;
  }

  .company {
    font-family: "Noto Serif TC", "Songti TC", Georgia, serif;
    font-size: 17px;
    letter-spacing: 0.06em;
    color: var(--text);
    margin: 0;
  }

  footer {
    margin-top: 36px;
    padding: 0 32px;
    text-align: center;
  }

  footer .line {
    width: 24px;
    height: 1px;
    background: var(--rule);
    margin: 0 auto 14px;
  }

  footer p {
    margin: 0;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--muted);
  }
</style>
</head>
