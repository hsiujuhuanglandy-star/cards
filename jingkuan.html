<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>陳璟寬・錄戰隊</title>
<style>
  :root {
    --bg: #eef3fb;
    --surface: #ffffff;
    --surface-2: #dce7f5;
    --text: #0b1f38;
    --muted: #51637a;
    --accent: #1a56d6;
    --accent-strong: #0f3fa8;
    --rule: #d3e0f0;
    --hero-bg: #0b1f38;
    --shadow: rgba(11, 31, 56, 0.16);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #060d18;
      --surface: #0e1b2e;
      --surface-2: #142544;
      --text: #eef3fb;
      --muted: #93a8c2;
      --accent: #5b8ef0;
      --accent-strong: #85aef7;
      --rule: #1c2f4d;
      --hero-bg: #060d18;
      --shadow: rgba(0, 0, 0, 0.4);
    }
  }

  :root[data-theme="dark"] {
    --bg: #060d18;
    --surface: #0e1b2e;
    --surface-2: #142544;
    --text: #eef3fb;
    --muted: #93a8c2;
    --accent: #5b8ef0;
    --accent-strong: #85aef7;
    --rule: #1c2f4d;
    --hero-bg: #060d18;
    --shadow: rgba(0, 0, 0, 0.4);
  }

  :root[data-theme="light"] {
    --bg: #eef3fb;
    --surface: #ffffff;
    --surface-2: #dce7f5;
    --text: #0b1f38;
    --muted: #51637a;
    --accent: #1a56d6;
    --accent-strong: #0f3fa8;
    --rule: #d3e0f0;
    --hero-bg: #0b1f38;
    --shadow: rgba(11, 31, 56, 0.16);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    width: 100%;
    max-width: 440px;
    padding: 0 0 48px;
  }

  .hero {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 5;
    overflow: hidden;
    background:
      radial-gradient(60% 50% at 50% 26%, rgba(91, 142, 240, 0.32), transparent 70%),
      var(--hero-bg);
  }

  .hero .frame-bar {
    position: absolute;
    left: 0;
    right: 0;
    height: 3px;
    background: var(--accent);
    opacity: 0.55;
  }
  .hero .frame-bar.top { top: 18px; }
  .hero .frame-bar.bottom { bottom: 18px; }

  .hero img {
    position: absolute;
    left: 50%;
    bottom: 0;
    transform: translateX(-50%);
    width: 86%;
    height: 94%;
    object-fit: contain;
    object-position: bottom center;
  }

  .hero::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent 62%, var(--bg) 98%);
  }

  .identity {
    position: relative;
    margin-top: -56px;
    padding: 0 32px;
    text-align: center;
  }

  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--accent-strong);
    margin: 0 0 10px;
  }

  h1 {
    font-family: "Noto Serif TC", "Songti TC", "PMingLiU", Georgia, serif;
    font-weight: 600;
    font-size: 34px;
    letter-spacing: 0.12em;
    margin: 0;
    color: var(--text);
  }

  .title-line {
    margin: 8px 0 0;
    font-size: 15px;
    color: var(--muted);
    letter-spacing: 0.04em;
  }

  .divider {
    width: 40px;
    height: 1px;
    background: var(--accent);
    margin: 20px auto;
    opacity: 0.6;
  }

  .company {
    font-family: "Noto Serif TC", "Songti TC", Georgia, serif;
    font-size: 17px;
    letter-spacing: 0.06em;
    color: var(--text);
    margin: 0;
  }

  section {
    padding: 28px 32px 0;
  }

  .section-label {
    font-size: 11px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 14px;
  }

  .tagline {
    margin: 0;
    font-family: "Noto Serif TC", "Songti TC", Georgia, serif;
    font-style: italic;
    font-size: 19px;
    line-height: 1.6;
    text-align: center;
    color: var(--accent-strong);
  }

  .bio {
    margin: 0;
    font-size: 14.5px;
    line-height: 1.75;
    color: var(--text);
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
  }

  .chip {
    padding: 10px 16px;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 999px;
    font-size: 13.5px;
    color: var(--text);
  }

  .contact {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .contact a {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 15px 18px;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 999px;
    text-decoration: none;
    color: var(--text);
    font-size: 15px;
    letter-spacing: 0.02em;
    transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .contact a:hover,
  .contact a:focus-visible {
    border-color: var(--accent);
    box-shadow: 0 6px 18px var(--shadow);
    transform: translateY(-1px);
  }

  .contact a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .icon {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--surface-2);
    color: var(--accent-strong);
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
  }

  .icon svg { width: 17px; height: 17px; fill: currentColor; }

  .label {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .label .k {
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .label .v {
    font-size: 15px;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }

  footer {
    margin-top: 36px;
    padding: 0 32px;
    text-align: center;
  }

  footer .line {
    width: 24px;
    height: 1px;
    background: var(--rule);
    margin: 0 auto 14px;
  }

  footer p {
    margin: 0;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--muted);
  }

  @media (prefers-reduced-motion: reduce) {
    .contact a { transition: none; }
  }
</style>
</head>
