<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>蔡宜倩・陞隆旅行社</title>
<style>
  :root {
    --bg: #fdf3ee;
    --surface: #ffffff;
    --surface-2: #f7ded2;
    --text: #3a2420;
    --muted: #8a6b62;
    --accent: #e8734a;
    --accent-strong: #c85530;
    --rule: #f0d9cd;
    --hero-bg: #f6d3d8;
    --shadow: rgba(58, 36, 32, 0.14);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #241512;
      --surface: #2f1e1a;
      --surface-2: #3a2620;
      --text: #f7ece6;
      --muted: #c9a99b;
      --accent: #ff8a5c;
      --accent-strong: #ffab7f;
      --rule: #4a332b;
      --hero-bg: #2f1e1a;
      --shadow: rgba(0, 0, 0, 0.4);
    }
  }

  :root[data-theme="dark"] {
    --bg: #241512;
    --surface: #2f1e1a;
    --surface-2: #3a2620;
    --text: #f7ece6;
    --muted: #c9a99b;
    --accent: #ff8a5c;
    --accent-strong: #ffab7f;
    --rule: #4a332b;
    --hero-bg: #2f1e1a;
    --shadow: rgba(0, 0, 0, 0.4);
  }

  :root[data-theme="light"] {
    --bg: #fdf3ee;
    --surface: #ffffff;
    --surface-2: #f7ded2;
    --text: #3a2420;
    --muted: #8a6b62;
    --accent: #e8734a;
    --accent-strong: #c85530;
    --rule: #f0d9cd;
    --hero-bg: #f6d3d8;
    --shadow: rgba(58, 36, 32, 0.14);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    width: 100%;
    max-width: 440px;
    padding: 0 0 48px;
  }

  .hero {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    background: var(--hero-bg);
  }

  .hero img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
  }

  .hero::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent 55%, var(--bg) 98%);
  }

  .identity {
    position: relative;
    margin-top: -56px;
    padding: 0 32px;
    text-align: center;
  }

  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--accent-strong);
    margin: 0 0 10px;
  }

  h1 {
    font-family: "Noto Serif TC", "Songti TC", "PMingLiU", Georgia, serif;
    font-weight: 600;
    font-size: 34px;
    letter-spacing: 0.12em;
    margin: 0;
    color: var(--text);
  }

  .title-line {
    margin: 8px 0 0;
    font-size: 15px;
    color: var(--muted);
    letter-spacing: 0.04em;
  }

  .divider {
    width: 40px;
    height: 1px;
    background: var(--accent);
    margin: 20px auto;
    opacity: 0.6;
  }

  .company {
    font-family: "Noto Serif TC", "Songti TC", Georgia, serif;
    font-size: 17px;
    letter-spacing: 0.06em;
    color: var(--text);
    margin: 0;
  }

  section {
    padding: 28px 32px 0;
  }

  .section-label {
    font-size: 11px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 14px;
  }

  .bio {
    margin: 0;
    font-size: 14.5px;
    line-height: 1.75;
    color: var(--text);
  }

  .contact {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .contact a {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 15px 18px;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 999px;
    text-decoration: none;
    color: var(--text);
    font-size: 15px;
    letter-spacing: 0.02em;
    transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .contact a:hover,
  .contact a:focus-visible {
    border-color: var(--accent);
    box-shadow: 0 6px 18px var(--shadow);
    transform: translateY(-1px);
  }

  .contact a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .icon {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--surface-2);
    color: var(--accent-strong);
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
  }

  .icon svg { width: 17px; height: 17px; fill: currentColor; }

  .label {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .label .k {
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .label .v {
    font-size: 15px;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }

  footer {
    margin-top: 36px;
    padding: 0 32px;
    text-align: center;
  }

  footer .line {
    width: 24px;
    height: 1px;
    background: var(--rule);
    margin: 0 auto 14px;
  }

  footer p {
    margin: 0;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--muted);
  }

  @media (prefers-reduced-motion: reduce) {
    .contact a { transition: none; }
  }
</style>
</head>
